name: Test missing tag-name fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          homebrew-tap: Homebrew/homebrew-core
          formula-name: wget
          # No tag-name provided — under workflow_dispatch the ref is
          # refs/heads/act-harness (not a tag), so the action should fail
          # with "invalid ref: refs/heads/act-harness"

      - name: Assert action failed
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when no tag-name is provided and ref is not a tag"
            exit 1
          fi
          echo "PASS: action correctly failed when no tag-name provided"
