name: Test missing tag-name error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Under act, github.context.ref is always refs/heads/act-harness (not a tag).
      # Without tag-name input, the action throws "invalid ref: refs/heads/act-harness".
      # We expect the action to fail, so we use continue-on-error and assert on the outcome.
      - id: action
        uses: .
        continue-on-error: true
        with:
          homebrew-tap: Homebrew/homebrew-core
          formula-name: wget
          download-url: https://ftp.gnu.org/gnu/wget/wget-1.21.4.tar.gz
          download-sha256: 81542f5cefb8faacc39bbbc6c82ded80e3e4a88505ae72ea51df27525bcde04c

      - name: Assert action failed due to missing tag-name
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no tag-name is provided and ref is not a tag"
            exit 1
          fi
          echo "PASS: action correctly failed when tag-name is missing and ref is not a tag"
