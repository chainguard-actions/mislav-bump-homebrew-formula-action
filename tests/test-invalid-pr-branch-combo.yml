name: Test invalid create-pullrequest + create-branch combination
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          homebrew-tap: Homebrew/homebrew-core
          formula-name: wget
          tag-name: v1.0.0
          download-url: https://example.com/wget-1.0.0.tar.gz
          download-sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          create-pullrequest: "true"
          create-branch: "false"
          # create-pullrequest=true with create-branch=false is explicitly
          # rejected by the action with an error message

      - name: Assert action failed due to invalid input combination
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when create-pullrequest=true and create-branch=false"
            exit 1
          fi
          echo "PASS: action correctly rejected invalid create-pullrequest + create-branch combination"
