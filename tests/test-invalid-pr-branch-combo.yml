name: Test invalid create-pullrequest + create-branch combination
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with conflicting PR/branch inputs
        id: action
        uses: .
        continue-on-error: true
        with:
          tag-name: v1.2.3
          download-url: https://example.com/myapp-1.2.3.tar.gz
          download-sha256: abc123def456abc123def456abc123def456abc123def456abc123def456abc1
          homebrew-tap: Homebrew/homebrew-core
          formula-name: myapp
          create-pullrequest: "true"
          create-branch: "false"

      - name: Assert action failed with expected error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to conflicting create-pullrequest=true and create-branch=false"
            exit 1
          fi
          echo "PASS: action correctly failed on invalid input combination"
