name: Test custom base-branch input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/tags/v3.0.0
      GITHUB_EVENT_NAME: push
      GITHUB_REPOSITORY: testowner/testrepo
      GITHUB_SHA: abc1234567890abcdef1234567890abcdef12345
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          formula-name: testrepo
          homebrew-tap: testowner/testrepo
          tag-name: v3.0.0
          download-url: https://github.com/testowner/testrepo/archive/refs/tags/v3.0.0.tar.gz
          download-sha256: cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
          base-branch: stable
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Assert action ran with base-branch input (expected to fail at API call)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should fail at the GitHub API call (can't push to testowner/testrepo),
          # but it must NOT be skipped — that would indicate a setup problem.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with base-branch input (outcome=$OUTCOME)"
