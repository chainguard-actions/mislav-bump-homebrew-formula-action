name: Test base-branch input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that the base-branch input is accepted and passed through to the action.
      # The action will fail at the API stage (no write access to the tap repository)
      # but should accept the base-branch input without input validation errors.
      - id: action
        uses: .
        continue-on-error: true
        with:
          homebrew-tap: Homebrew/homebrew-core
          formula-name: wget
          tag-name: v1.21.4
          download-url: https://ftp.gnu.org/gnu/wget/wget-1.21.4.tar.gz
          download-sha256: 81542f5cefb8faacc39bbbc6c82ded80e3e4a88505ae72ea51df27525bcde04c
          base-branch: master

      - name: Assert action ran with base-branch input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should process the base-branch input without crashing on
          # input validation. It may fail at the GitHub API stage (no write access
          # to homebrew-core), which is expected and acceptable.
          echo "PASS: action ran with base-branch input (outcome=$OUTCOME is expected)"
