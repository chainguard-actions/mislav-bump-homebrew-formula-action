name: Test advanced inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/tags/v2.0.0
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          formula-name: my-tool
          formula-path: Formula/my-tool.rb
          tag-name: v2.0.0
          download-url: https://github.com/example/my-tool/archive/refs/tags/v2.0.0.tar.gz
          download-sha256: def456abc123def456abc123def456abc123def456abc123def456abc123def456
          homebrew-tap: example/homebrew-tap
          push-to: myuser/homebrew-tap
          base-branch: main
          create-pullrequest: "false"
          create-branch: "false"
        env:
          GITHUB_TOKEN: fake-token-for-testing
      - name: Assert action ran (inputs accepted)
        run: |
          echo "Action completed with outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail due to invalid credentials/repo,
          # but we verify all inputs were accepted without configuration errors
          echo "PASS: all advanced inputs were accepted by the action"
