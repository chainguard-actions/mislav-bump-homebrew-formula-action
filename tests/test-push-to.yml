name: Test push-to input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/tags/v2.3.0
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          homebrew-tap: myorg/homebrew-tools
          formula-name: myapp
          tag-name: v2.3.0
          download-url: https://example.com/myapp-2.3.0.tar.gz
          download-sha256: 1122334455667788990011223344556677889900112233445566778899001122
          push-to: myfork/homebrew-tools
          commit-message: "Bump {{formulaName}} to {{version}}"
        env:
          GITHUB_TOKEN: fake-token
      - name: Assert action failed at API stage (not input validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the fake token is rejected by GitHub API,
          # not because of input validation errors (push-to is a valid input).
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (API call with fake token)"
            exit 1
          fi
          echo "PASS: action accepted push-to input and reached API stage"
