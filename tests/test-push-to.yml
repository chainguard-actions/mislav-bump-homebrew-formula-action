name: Test push-to input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that the push-to input is accepted and passed through to the action.
      # The push-to input specifies an existing fork of the homebrew-tap repository
      # where the edit should be pushed to, instead of creating a personal fork.
      # The action will fail at the API stage (no write access to the specified fork)
      # but should accept the push-to input without input validation errors.
      - id: action
        uses: .
        continue-on-error: true
        with:
          homebrew-tap: Homebrew/homebrew-core
          formula-name: wget
          tag-name: v1.21.4
          download-url: https://ftp.gnu.org/gnu/wget/wget-1.21.4.tar.gz
          download-sha256: 81542f5cefb8faacc39bbbc6c82ded80e3e4a88505ae72ea51df27525bcde04c
          push-to: mislav/homebrew-core

      - name: Assert action ran with push-to input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should process the push-to input without crashing on
          # input validation. It may fail at the GitHub API stage (no write access
          # to the specified fork), which is expected and acceptable.
          echo "PASS: action ran with push-to input (outcome=$OUTCOME is expected)"
