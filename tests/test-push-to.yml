name: Test push-to input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          homebrew-tap: Homebrew/homebrew-core
          formula-name: wget
          tag-name: v1.0.0
          download-url: https://example.com/wget-1.0.0.tar.gz
          download-sha256: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          push-to: mislav/homebrew-core
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Assert action ran past input validation (push-to input accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action is expected to fail at the GitHub API level (trying to update homebrew-core),
          # but it should NOT fail at input validation. The push-to input should be accepted.
          echo "Action completed with outcome: $OUTCOME"
          echo "PASS: action ran with push-to input provided"
