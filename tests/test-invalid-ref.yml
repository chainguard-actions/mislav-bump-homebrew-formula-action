name: Test invalid ref error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          homebrew-tap: myorg/homebrew-utils
          commit-message: "Bump {{formulaName}} to {{version}}"
        env:
          GITHUB_TOKEN: fake-token
      - name: Assert action failed with invalid ref error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when ref is not a tag"
            exit 1
          fi
          echo "PASS: action correctly failed for non-tag ref"
