name: Test invalid ref error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
      GITHUB_REPOSITORY: testowner/testrepo
      GITHUB_SHA: abc1234567890abcdef1234567890abcdef12345
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          formula-name: testrepo
          homebrew-tap: testowner/testrepo
          download-sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        env:
          GITHUB_TOKEN: fake-token-for-testing

      - name: Assert action failed with invalid ref error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when ref is not a tag, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when GITHUB_REF is not a tag ref"
