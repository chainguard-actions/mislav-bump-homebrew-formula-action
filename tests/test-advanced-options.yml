name: Test advanced options inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/tags/v2.0.0
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          formula-name: myformula
          tag-name: v2.0.0
          homebrew-tap: example/homebrew-example
          push-to: myuser/homebrew-example
          base-branch: main
          create-pullrequest: "false"
          create-branch: "false"
          commit-message: |
            myformula v2.0.0

            Created by https://github.com/mislav/bump-homebrew-formula-action
        env:
          GITHUB_TOKEN: fake-token-for-testing
      - name: Assert action ran (inputs were accepted)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail without real credentials,
          # but it should not fail due to missing/invalid inputs.
          # We verify it ran (started) by checking the outcome is not skipped.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with all advanced option inputs provided"
