name: Test create-branch and commit-message inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/tags/v3.0.0
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          formula-name: mytool
          tag-name: v3.0.0
          download-url: https://github.com/example/mytool/archive/refs/tags/v3.0.0.tar.gz
          download-sha256: cafebabecafebabecafebabecafebabecafebabecafebabecafebabecafebabe
          homebrew-tap: example/homebrew-mytool
          create-branch: "true"
          create-pullrequest: "true"
          commit-message: |
            mytool {{version}}

            Automated update by bump-homebrew-formula-action
        env:
          GITHUB_TOKEN: fake-token-for-testing
      - name: Assert action ran (may fail due to missing credentials)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "PASS: action step executed (credentials not available in test environment)"
