name: Test invalid ref error (no tag-name input)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          homebrew-tap: Homebrew/homebrew-core
          formula-name: test-formula
          # Intentionally omitting tag-name so the action tries to use context.ref
          # Under act, context.ref is refs/heads/act-harness (not a tag), so it should fail
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Assert action failed with invalid ref error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when no tag-name is provided and ref is not a tag"
            exit 1
          fi
          echo "PASS: action correctly failed when ref is not a tag ref"
