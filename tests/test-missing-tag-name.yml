name: Test missing tag-name with non-tag ref
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action without tag-name on non-tag ref
        id: action
        uses: .
        continue-on-error: true
        with:
          download-url: https://example.com/myapp-1.2.3.tar.gz
          download-sha256: abc123def456abc123def456abc123def456abc123def456abc123def456abc1
          homebrew-tap: Homebrew/homebrew-core
          formula-name: myapp
          # No tag-name provided; act runs on refs/heads/act-harness (not a tag ref)
          # The action should throw: invalid ref: refs/heads/act-harness

      - name: Assert action failed due to invalid ref
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail because no tag-name was given and ref is not a tag ref"
            exit 1
          fi
          echo "PASS: action correctly failed when tag-name is absent and ref is not a tag ref"
