name: Test conflicting inputs error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/tags/v1.2.3
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          formula-name: my-formula
          homebrew-tap: Homebrew/homebrew-core
          tag-name: v1.2.3
          download-url: https://example.com/my-formula-1.2.3.tar.gz
          download-sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          create-pullrequest: "true"
          create-branch: "false"
        env:
          COMMITTER_TOKEN: fake-token-for-testing

      - name: Assert action failed due to conflicting inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to conflicting create-pullrequest/create-branch inputs, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when create-pullrequest=true and create-branch=false"
