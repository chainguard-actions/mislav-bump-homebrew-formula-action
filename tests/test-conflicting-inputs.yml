name: Test conflicting inputs error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/tags/v1.0.0
      GITHUB_EVENT_NAME: push
      GITHUB_REPOSITORY: testowner/testrepo
      GITHUB_SHA: abc1234567890abcdef1234567890abcdef12345
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          formula-name: testrepo
          homebrew-tap: testowner/testrepo
          tag-name: v1.0.0
          download-url: https://github.com/testowner/testrepo/archive/refs/tags/v1.0.0.tar.gz
          download-sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          create-pullrequest: "true"
          create-branch: "false"
        env:
          GITHUB_TOKEN: fake-token-for-testing

      - name: Assert action failed due to conflicting inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when create-pullrequest=true and create-branch=false, got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with conflicting create-pullrequest/create-branch inputs"
