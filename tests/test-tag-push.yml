name: Test tag push scenario
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/tags/v1.2.3
      GITHUB_EVENT_NAME: push
      GITHUB_REPOSITORY: testowner/testrepo
      GITHUB_SHA: abc1234567890abcdef1234567890abcdef12345
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          formula-name: testrepo
          homebrew-tap: testowner/testrepo
          tag-name: v1.2.3
          download-url: https://github.com/testowner/testrepo/archive/refs/tags/v1.2.3.tar.gz
          download-sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        env:
          GITHUB_TOKEN: fake-token-for-testing

      - name: Assert action ran (expected to fail at API call, not at input validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should fail (no real GitHub token), but it should not be a
          # missing-input or invalid-ref error — those would indicate a test setup problem.
          # We accept either success or failure here; the key is it started correctly.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME)"
