name: Test tag push basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/tags/v2.0.0
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          formula-name: my-formula
          homebrew-tap: Homebrew/homebrew-core
          tag-name: v2.0.0
          download-url: https://example.com/my-formula-2.0.0.tar.gz
          download-sha256: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
        env:
          COMMITTER_TOKEN: fake-token-for-testing

      - name: Assert action failed at API stage (not input validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because the fake token cannot authenticate
          # with the GitHub API, but it should NOT fail due to input validation.
          # Any failure here is acceptable — we just confirm the action ran.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable in test environment)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed at API stage as expected with fake credentials"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
