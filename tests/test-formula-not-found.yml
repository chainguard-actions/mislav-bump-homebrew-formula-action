name: Test formula file not found in tap
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          homebrew-tap: Homebrew/homebrew-core
          formula-name: this-formula-does-not-exist-xyz-abc-12345
          formula-path: Formula/t/this-formula-does-not-exist-xyz-abc-12345.rb
          tag-name: v1.0.0
          download-url: https://example.com/this-formula-does-not-exist-xyz-abc-12345-1.0.0.tar.gz
          download-sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          create-pullrequest: "false"
          create-branch: "false"
          # The formula file does not exist in homebrew-core, so the action
          # should fail with a 404 API error when trying to fetch the file content

      - name: Assert action failed with API error
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when formula file does not exist"
            exit 1
          fi
          echo "PASS: action correctly failed when formula file does not exist in tap"
