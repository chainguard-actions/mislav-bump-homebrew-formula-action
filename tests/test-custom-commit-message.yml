name: Test custom commit message template
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with custom commit message and explicit tag-name
        id: action
        uses: .
        continue-on-error: true
        with:
          tag-name: v2.0.0
          download-url: https://example.com/myapp-2.0.0.tar.gz
          download-sha256: deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef
          homebrew-tap: Homebrew/homebrew-core
          formula-name: myapp
          commit-message: |
            Bump {{formulaName}} to {{version}}

            Automated update via bump-homebrew-formula-action

      - name: Assert action failed at API stage (not input validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail when trying to reach the GitHub API for homebrew-core,
          # NOT at input validation. This confirms inputs (including commit-message template)
          # were accepted and processed correctly.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (at API stage, not input validation)"
            exit 1
          fi
          echo "PASS: action processed custom commit-message template and failed at expected API stage"
