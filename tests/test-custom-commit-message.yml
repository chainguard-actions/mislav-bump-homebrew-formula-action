name: Test custom commit message template
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          homebrew-tap: Homebrew/homebrew-core
          formula-name: nonexistent-formula-test-xyz
          formula-path: Formula/n/nonexistent-formula-test-xyz.rb
          tag-name: v2.5.0
          download-url: https://example.com/nonexistent-formula-test-xyz-2.5.0.tar.gz
          download-sha256: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          create-pullrequest: "false"
          create-branch: "false"
          commit-message: |
            {{formulaName}} {{version}} - custom message

            Updated by test

      - name: Assert action failed at API stage (not at input validation)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail (formula does not exist in homebrew-core)"
            exit 1
          fi
          echo "PASS: action correctly failed at API stage with custom commit message template"
