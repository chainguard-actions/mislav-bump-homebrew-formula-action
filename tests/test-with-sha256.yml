name: Test with explicit SHA256 checksum
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          formula-name: myformula
          tag-name: v2.0.0
          download-url: https://github.com/example/myformula/archive/refs/tags/v2.0.0.tar.gz
          download-sha256: abc123def456abc123def456abc123def456abc123def456abc123def456abc1
          homebrew-tap: Homebrew/homebrew-core
          commit-message: |
            myformula 2.0.0

            Created by https://github.com/mislav/bump-homebrew-formula-action

      - name: Assert action ran and failed gracefully (sentinel repo / API limits)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under harness — sentinel repo or API limits)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
