name: Test with custom formula path and no pull request
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          formula-name: myformula
          formula-path: Formula/myformula.rb
          tag-name: v1.2.3
          download-url: https://github.com/example/myformula/archive/refs/tags/v1.2.3.tar.gz
          download-sha256: deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef
          homebrew-tap: Homebrew/homebrew-core
          create-pullrequest: "false"

      - name: Assert action ran and failed gracefully (sentinel repo / API limits)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected under harness — sentinel repo or API limits)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
