name: Test conflicting options error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action throws an error when create-pullrequest=true and create-branch=false
      # because a PR requires a branch. This validation happens before any API calls.
      - id: action
        uses: .
        continue-on-error: true
        with:
          homebrew-tap: Homebrew/homebrew-core
          formula-name: wget
          tag-name: v1.21.4
          download-url: https://ftp.gnu.org/gnu/wget/wget-1.21.4.tar.gz
          download-sha256: 81542f5cefb8faacc39bbbc6c82ded80e3e4a88505ae72ea51df27525bcde04c
          create-pullrequest: "true"
          create-branch: "false"

      - name: Assert action failed due to conflicting options
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when create-pullrequest=true and create-branch=false"
            exit 1
          fi
          echo "PASS: action correctly failed with conflicting create-pullrequest/create-branch options"
