name: Test push-to existing fork input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          formula-name: myformula
          formula-path: Formula/m/myformula.rb
          tag-name: v1.0.0
          download-url: https://example.com/myformula-1.0.0.tar.gz
          download-sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          homebrew-tap: Homebrew/homebrew-core
          push-to: example-user/homebrew-core
          create-pullrequest: "false"
          create-branch: "false"

      - name: Assert action ran (expected to fail due to non-existent formula/fork)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should fail with an API/auth error (formula not found, fork not found, etc.)
          # but NOT with a configuration/setup error. Either success or failure is acceptable
          # since we are testing that the push-to input is accepted and processed.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran to completion with push-to input (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
