name: Test push-to fork with no pull request
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          formula-name: myformula
          tag-name: v3.0.0
          download-url: https://github.com/example/myformula/archive/refs/tags/v3.0.0.tar.gz
          homebrew-tap: Homebrew/homebrew-core
          push-to: myuser/homebrew-core
          create-pullrequest: "false"
          create-branch: "false"

      - name: Assert action ran (succeeded or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or tap not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
