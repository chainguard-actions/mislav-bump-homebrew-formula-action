name: Test basic inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/tags/v1.2.3
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          formula-name: mytool
          formula-path: Formula/mytool.rb
          tag-name: v1.2.3
          download-url: https://github.com/example/mytool/archive/refs/tags/v1.2.3.tar.gz
          download-sha256: abc123def456abc123def456abc123def456abc123def456abc123def456abc123
          homebrew-tap: Homebrew/homebrew-core
          commit-message: |
            {{formulaName}} {{version}}

            Created by https://github.com/mislav/bump-homebrew-formula-action
      - name: Assert action ran (may fail due to missing credentials)
        run: |
          echo "Action step completed (continue-on-error: true)"
          echo "PASS: inputs were accepted"
