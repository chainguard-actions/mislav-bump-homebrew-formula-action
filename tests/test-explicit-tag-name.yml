name: Test explicit tag-name input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Using a branch ref (not a tag) - the action should use tag-name input instead
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          homebrew-tap: myorg/homebrew-utils
          formula-name: myapp
          tag-name: v3.1.0
          download-url: https://example.com/myapp-3.1.0.tar.gz
          download-sha256: cafebabecafebabecafebabecafebabecafebabecafebabecafebabecafebabe
          commit-message: "Bump {{formulaName}} to {{version}}"
        env:
          GITHUB_TOKEN: fake-token
      - name: Assert action failed at API stage (not at ref parsing)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # When tag-name is explicitly provided, the action should bypass ref parsing
          # and proceed to the API call stage. It will fail due to fake token,
          # but NOT with "invalid ref" error.
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (API call with fake token)"
            exit 1
          fi
          echo "PASS: action used explicit tag-name and reached API stage"
