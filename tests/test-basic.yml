name: Test basic usage with formula inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/tags/v1.2.3
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          formula-name: myformula
          formula-path: Formula/myformula.rb
          tag-name: v1.2.3
          download-url: https://github.com/example/myformula/archive/refs/tags/v1.2.3.tar.gz
          download-sha256: abc123def456abc123def456abc123def456abc123def456abc123def456abc1
          homebrew-tap: example/homebrew-example
        env:
          GITHUB_TOKEN: fake-token-for-testing
      - name: Assert action ran (inputs were accepted)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail without real credentials,
          # but it should not fail due to missing/invalid inputs.
          # We verify it ran (started) by checking the outcome is not skipped.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with all formula inputs provided"
