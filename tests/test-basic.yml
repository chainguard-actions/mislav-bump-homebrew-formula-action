name: Test basic usage with formula inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/tags/v1.0.0
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          formula-name: my-tool
          formula-path: Formula/my-tool.rb
          tag-name: v1.0.0
          download-url: https://github.com/example/my-tool/archive/refs/tags/v1.0.0.tar.gz
          download-sha256: abc123def456abc123def456abc123def456abc123def456abc123def456abc1
          homebrew-tap: Homebrew/homebrew-core
      - name: Assert action ran (may fail due to missing credentials)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "PASS: action step executed (credentials not available in test environment)"
