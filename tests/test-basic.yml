name: Test basic usage with core inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/tags/v1.2.3
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          formula-name: mytool
          tag-name: v1.2.3
          download-url: https://github.com/example/mytool/archive/refs/tags/v1.2.3.tar.gz
          download-sha256: abc123def456abc123def456abc123def456abc123def456abc123def456abc123
          homebrew-tap: example/homebrew-mytool
        env:
          GITHUB_TOKEN: fake-token-for-testing
      - name: Assert action ran (may fail due to missing credentials)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "PASS: action step executed (credentials not available in test environment)"
